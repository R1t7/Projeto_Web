{% extends 'base.html' %}

{% block title %}Criar Evento - SGEA{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">Criar Novo Evento</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="tipo">Tipo de Evento</label>
            <select class="form-control" id="tipo" name="tipo" required>
                <option value="">Selecione...</option>
                <option value="SEMINARIO">Seminário</option>
                <option value="PALESTRA">Palestra</option>
                <option value="MINICURSO">Minicurso</option>
                <option value="SEMANA_ACADEMICA">Semana Acadêmica</option>
            </select>
        </div>
        <div class="form-group">
            <label for="titulo">Título do Evento</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required>
        </div>
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea class="form-control" id="descricao" name="descricao" rows="4" required></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="data_inicio">Data de Início</label>
                <input type="date" class="form-control" id="data_inicio" name="data_inicio" required>
            </div>
            <div class="form-group">
                <label for="data_fim">Data de Término</label>
                <input type="date" class="form-control" id="data_fim" name="data_fim">
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="horario">Horário</label>
                <input type="time" class="form-control" id="horario" name="horario" required>
            </div>
            <div class="form-group">
                <label for="vagas">Número de Vagas</label>
                <input type="number" class="form-control" id="vagas" name="vagas" min="1" required>
            </div>
        </div>
        <div class="form-group">
            <label for="local">Local</label>
            <input type="text" class="form-control" id="local" name="local" required>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-success">Criar Evento</button>
            <a href="{% url 'listar_eventos' %}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
